[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextFrag"
version = "0.1.0"
license = {text = "MIT"}
authors = [
  { name="Justin Qian", email="jqian16@student.ubc.ca" },
  { name="Emmanuel Cazottes" },
]
description = "A PyTorch-based framework for benchmarking active learning strategies on DNA sequence-to-expression models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "torch>=2.5.1",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
gpu = ["cuml-cu12==26.4.*"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Github = "https://github.com/de-Boer-Lab/nextFrag"
